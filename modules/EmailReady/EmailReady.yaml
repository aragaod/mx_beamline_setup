seasonal_templates:
  # The code will check this list from top to bottom and use the FIRST match it finds.
  # Note: For festivals with variable dates (Lunar New Year, Easter, Diwali), these
  # are approximate ranges and may need occasional adjustment.
  - name: 'WinterFestive'
    file: 'email_template_S1_Winter.jinja2'
    date_ranges: [[12, 1, 12, 31], [1, 1, 1, 7]] # Dec 1st - Jan 7th
  - name: 'LunarNewYear'
    file: 'email_template_S2_LunarNewYear.jinja2'
    date_ranges: [[1, 25, 2, 15]] # Approx range for late Jan / early Feb
  - name: 'SpringEaster'
    file: 'email_template_S3_Spring.jinja2'
    date_ranges: [[3, 20, 4, 30]] # First day of Spring to end of April
  - name: 'Summer'
    file: 'email_template_S4_Summer.jinja2'
    date_ranges: [[6, 1, 8, 31]] # June, July, August
  - name: 'AutumnHalloween'
    file: 'email_template_S5_Autumn.jinja2'
    date_ranges: [[10, 15, 11, 10]] # Mid-Oct to after Bonfire Night
  - name: 'Diwali'
    file: 'email_template_S6_Diwali.jinja2'
    date_ranges: [[10, 20, 11, 15]] # Approx range for Oct/Nov
  - name: 'AustraliaDay'
    file: 'email_template_S7_AustraliaDay.jinja2'
    date_ranges: [[1, 24, 1, 28]] # Around Jan 26th
  - name: 'StDavidsDay'
    file: 'email_template_S8_StDavidsDay.jinja2'
    date_ranges: [[2, 27, 3, 3]] # Around Mar 1st
  - name: 'StPatricksDay'
    file: 'email_template_S9_StPatricksDay.jinja2'
    date_ranges: [[3, 15, 3, 19]] # Around Mar 17th
  - name: 'StAndrewsDay'
    file: 'email_template_S10_StAndrewsDay.jinja2'
    date_ranges: [[11, 28, 12, 2]] # Around Nov 30th
  # FALLBACK - This MUST be the last item in the list.
  - name: 'General'
    file: 'email_template_S11_General.jinja2'

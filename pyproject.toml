# Formatting configuration. The project is formatted with black; run:
#
#     python3 -m black .
#
# Discovery already skips addons/, dev/ and I03_autobeamlinesetup.py because black
# honours .gitignore, but the exclusion below is explicit for two reasons:
#
#   * I03_autobeamlinesetup.py is a SYMLINK to /dls_sw/i03/scripts/GM_I03.py, which
#     belongs to i03. Formatting it would rewrite another beamline's production
#     script. It is Python 2 and kept only as a reference.
#   * addons/ is vendored third-party code and is not ours to reformat.
#   * UIs_py/ is GENERATED by generate_python_from_ui.sh (pyuic5) from UIs/*.ui.
#     Formatting it would be undone the next time the UI is regenerated, and the
#     diff would then look like a real change. Leave generated code alone.
#
# dev/refresh_dev_redis.py is tracked even though dev/ is gitignored, so it is
# named explicitly below to keep it formatted with the rest of the project.

[tool.black]
line-length = 88
force-exclude = '''
/(
    \.git
  | addons
  | UIs_py
  | I03_autobeamlinesetup\.py
)/?
'''
